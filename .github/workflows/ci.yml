name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: ${{ matrix.database == 'postgresql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          POSTGRES_DB: aiops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiops -d aiops_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend && ruff format --check backend
      - name: Test SQLite
        if: matrix.database == 'sqlite'
        run: pytest --cov=backend --cov-report=term-missing
      - name: Test PostgreSQL
        if: matrix.database == 'postgresql'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://aiops:ci-only-not-a-real-secret@localhost:5432/aiops_test
        run: pytest
      - name: Check generated API reference
        run: python -m backend.scripts.export_openapi && git diff --exit-code -- docs/openapi.json
      - run: pip-audit -r backend/requirements.txt
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm test && npm run format:check
        working-directory: frontend
      - run: npm run build && npm audit
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements.txt
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
          retention-days: 7

# Invoked explicitly by deploy_gcp.sh; never runs on local startup.
steps:
  - id: backend
    name: gcr.io/cloud-builders/docker
    args:
      [
        build,
        -f,
        backend/Dockerfile,
        -t,
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:${_TAG}",
        .,
      ]
    waitFor: ["-"]
  - id: frontend
    name: gcr.io/cloud-builders/docker
    args:
      [
        build,
        -t,
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:${_TAG}",
        ./frontend,
      ]
    waitFor: ["-"]
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:${_TAG}"
substitutions:
  _REGION: us-central1
  _REPOSITORY: aiops
  _TAG: latest
options:
  logging: CLOUD_LOGGING_ONLY
